[project]
name = "edcfg-lint"
version = "0.1.0"
description = "A fast EditorConfig linter written in Rust"
readme = "README.md"
requires-python = ">=3.8"
dependencies = []
license = "MIT"
authors = [{ name = "Andrew Steinborn" }]
keywords = ["editorconfig", "linter", "code-style", "formatting"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Rust",
    "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://github.com/astei/edcfg-lint"
Repository = "https://github.com/astei/edcfg-lint"
Issues = "https://github.com/astei/edcfg-lint/issues"

[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[tool.maturin]
bindings = "bin"
strip = true
