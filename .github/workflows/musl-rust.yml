name: musl test

on:
    push: ~

# We need this to be able to create releases.
permissions:
    contents: write

env:
    CARGO_TERM_COLOR: always

jobs:

    # The build-release job runs to build the release artifacts.
    build-release:
        name: build-release
        runs-on: ${{ matrix.os }}
        env:
            CARGO: cargo
            # When CARGO is set to CROSS, this is set to `--target matrix.target`.
            TARGET_FLAGS: ""
            # When CARGO is set to CROSS, TARGET_DIR includes matrix.target.
            TARGET_DIR: ./target
            
        strategy:
            fail-fast: false
            matrix:
                include:
                    - os: ubuntu-latest
                      target: x86_64-unknown-linux-musl
                    - os: ubuntu-latest
                      target: i686-unknown-linux-musl
                    - os: ubuntu-24.04-arm
                      target: aarch64-unknown-linux-musl

        steps:
            - uses: actions/checkout@v4

            - name: Install Rust toolchain for target
              uses: dtolnay/rust-toolchain@stable
              with:
                  targets: ${{ matrix.target }}

            - name: Install Cross
              if: matrix.os == 'ubuntu-latest' && matrix.target != ''
              run: cargo install cross --tag v0.2.5 --git https://github.com/cross-rs/cross && echo "CARGO=cross" >> $GITHUB_ENV

            - if: ${{ contains(matrix.target, '-musl') }}
              run: |
                sudo apt-get install musl-tools musl-dev
                echo "CC_aarch64_unknown_linux_musl=musl-gcc" >> $GITHUB_ENV
                echo "AR_aarch64_unknown_linux_musl=ar" >> $GITHUB_ENV
                echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc" >> $GITHUB_ENV

            - name: Set target variables
              shell: bash
              run: |
                  echo "TARGET_FLAGS=--target ${{ matrix.target }}" >> $GITHUB_ENV
                  echo "TARGET_DIR=./target/${{ matrix.target }}" >> $GITHUB_ENV

                  # jemalloc is not portable and aarch64 systems tend to have larger page sizes
                  if [ "$(uname -p)" = "aarch64" ]; then echo "JEMALLOC_SYS_WITH_LG_PAGE=16" >> $GITHUB_ENV; fi

            - name: Show command used for Cargo
              shell: bash
              run: |
                  echo "cargo command is: ${{ env.CARGO }}"
                  echo "target flag is: ${{ env.TARGET_FLAGS }}"
                  echo "target dir is: ${{ env.TARGET_DIR }}"

            - name: Build release binary
              shell: bash
              run: |
                  ${{ env.CARGO }} build --verbose --profile release-lto ${{ env.TARGET_FLAGS }}
                  if [[ "${{ matrix.os }}" == windows-* ]]; then
                    bin="target/${{ matrix.target }}/release-lto/edcfg-lint.exe"
                    final_bin="edcfg-lint.exe"
                  else
                    bin="target/${{ matrix.target }}/release-lto/edcfg-lint"
                    final_bin="edcfg-lint"
                  fi

                  cp $bin $final_bin
                  echo "BIN=$final_bin" >> $GITHUB_ENV
                  version="${{ needs.create-release.outputs.version }}"
                  echo "ARCHIVE=edcfg-lint-$version-${{ matrix.target }}" >> $GITHUB_ENV
